services:
  backend:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    restart: always
    networks:
      - p2p-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - p2p-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - p2p-net

networks:
  p2p-net:
    driver: bridge